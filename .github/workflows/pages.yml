name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "server/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build the static site
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-liberation
          npm install
          npm run build:pages
      - name: Commit the static site to the branch Pages already serves
        run: |
          set -euo pipefail
          rm -rf assets
          cp -a dist/pages/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html .nojekyll favicon.svg assets \
            dashboard acquiring company decisions research product-lab \
            inventory tests brand commerce costs suppliers launch content documents
          if git diff --cached --quiet; then
            echo "Site already published."
            exit 0
          fi
          git commit -m "Publish the command center for GitHub Pages"
          git push
